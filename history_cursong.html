<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Current Song History</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px;
            overflow: hidden;
            font-family: "Meiryo", "Yu Gothic", sans-serif;
            color: #f8fbff;
            background: linear-gradient(135deg, #08111f 0%, #102133 54%, #111827 100%);
        }

        #all {
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
        }

        .current {
            padding: 14px 18px;
            border: 2px solid rgba(125, 211, 252, 0.45);
            background: rgba(8, 20, 34, 0.92);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .topline {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
        }

        .song-title {
            min-width: 0;
            font-size: 44px;
            font-weight: 800;
            line-height: 1.12;
            text-shadow: 3px 3px 0 #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex: 0 0 auto;
            min-width: 260px;
        }

        .difficulty {
            font-size: 38px;
            font-weight: 800;
            color: #facc15;
            text-shadow: 2px 2px 0 #000;
            white-space: nowrap;
        }

        .scene {
            font-size: 20px;
            color: #93c5fd;
        }

        .artist {
            margin-top: 8px;
            font-size: 24px;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .option {
            margin-top: 8px;
            font-size: 22px;
            color: #86efac;
            min-height: 30px;
        }

        .info-panel {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
        }

        .info-panel.visible {
            display: block;
        }

        .info-row {
            display: grid;
            grid-template-columns: 92px repeat(5, minmax(0, auto));
            gap: 12px;
            align-items: center;
            margin-top: 6px;
            font-size: 20px;
        }

        .info-title {
            color: #bae6fd;
            font-weight: 800;
        }

        .info-item {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-label {
            color: #94a3b8;
            margin-right: 4px;
        }

        .info-value {
            color: #f8fbff;
            font-weight: 800;
        }

        .best-option {
            color: #86efac;
        }

        .nexus-value {
            color: #facc15;
        }

        .option-line {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .option-label {
            flex: 0 0 auto;
        }

        .random-pattern {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            line-height: 0;
            vertical-align: middle;
        }

        .random-pattern + .option-text,
        .option-text + .random-pattern {
            margin-left: 8px;
        }

        .random-digit {
            display: inline-block;
            flex: 0 0 auto;
            width: 30px;
            height: 49px;
            background-image: url("./src/random_pattern.png");
            background-repeat: no-repeat;
            background-size: 239.0px 49px;
            background-position: calc(var(--digit-index) * -29.875px) 0;
        }

        .random-pattern-small .random-digit {
            width: 20px;
            height: 33px;
            background-size: 160.7px 33px;
            background-position: calc(var(--digit-index) * -20.0875px) 0;
        }

        .history {
            margin-top: 12px;
            border: 2px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.82);
        }

        .history-header,
        .row {
            display: grid;
            grid-template-columns: 180px 120px 140px 130px 100px 1fr;
            gap: 12px;
            align-items: center;
        }

        .history-header {
            padding: 8px 14px;
            font-size: 18px;
            color: #bae6fd;
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
        }

        .row {
            padding: 8px 14px;
            font-size: 22px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        }

        .row:last-child {
            border-bottom: none;
        }

        .row:nth-child(even) {
            background: rgba(255, 255, 255, 0.035);
        }

        .score {
            font-weight: 800;
            color: #ffffff;
        }

        .rate {
            color: #a7f3d0;
        }

        .bp {
            color: #fca5a5;
        }

        .lamp {
            display: inline-block;
            width: 40px;
            height: 42px;
            vertical-align: middle;
            box-shadow: 3px 3px 0 #000;
        }

        .lamp-empty {
            display: inline-block;
            width: 40px;
            height: 42px;
        }

        .failed {
            animation-name: flashfailed;
            animation-duration: 0.08s;
            animation-iteration-count: infinite;
        }

        @keyframes flashfailed {
            0% { background-color: #ff2828; }
            50% { background-color: #282828; }
            100% { background-color: #ff2828; }
        }

        .ac { background-color: #ff66ff; }
        .ec { background-color: #22ff22; }
        .nc { background-color: #22ccff; }
        .hc { background-color: #ffffff; }

        .exh {
            animation-name: flashexh;
            animation-duration: 0.08s;
            animation-iteration-count: infinite;
        }

        @keyframes flashexh {
            0% { background-color: #ff2828; }
            50% { background-color: #ffff28; }
            100% { background-color: #ff2828; }
        }

        .fc {
            animation-name: flashfc;
            animation-duration: 0.2s;
            animation-iteration-count: infinite;
        }

        @keyframes flashfc {
            0% { background-color: #ff2828; }
            20% { background-color: #d5ff28; }
            40% { background-color: #28ff7e; }
            60% { background-color: #2872ff; }
            80% { background-color: #d528ff; }
            100% { background-color: #ff2828; }
        }

        .perfect {
            animation-name: flashperfect;
            animation-duration: 0.2s;
            animation-iteration-count: infinite;
        }

        @keyframes flashperfect {
            0% { background-color: #ffff77; }
            25% { background-color: #dddd33; }
            50% { background-color: #aaaa00; }
            75% { background-color: #dddd33; }
            100% { background-color: #ffff77; }
        }

        .max {
            animation-name: flashmax;
            animation-duration: 0.2s;
            animation-iteration-count: infinite;
        }

        @keyframes flashmax {
            0% { background-color: #ffaaff; }
            25% { background-color: #dd33dd; }
            50% { background-color: #aa00aa; }
            75% { background-color: #dd33dd; }
            100% { background-color: #ffaaff; }
        }

        .history-option {
            color: #86efac;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            padding: 26px 14px;
            font-size: 26px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="all">
        <section class="current">
            <div class="topline">
                <div class="song-title" id="title">No song</div>
                <div class="song-meta">
                    <div class="difficulty" id="difficulty">-</div>
                    <div class="scene" id="scene">waiting</div>
                </div>
            </div>
            <div class="artist" id="artist"></div>
            <div class="option" id="option"></div>
            <div class="info-panel" id="best-panel"></div>
            <div class="info-panel" id="nexus-panel"></div>
        </section>

        <section class="history">
            <div class="history-header">
                <div>Time</div>
                <div>Lamp</div>
                <div>Score</div>
                <div>Rate</div>
                <div>BP</div>
                <div>Option</div>
            </div>
            <div id="history-body">
                <div class="empty">Waiting for current song...</div>
            </div>
        </section>
    </div>

    <script>
        const sceneNames = {
            select: "選曲",
            play: "プレー",
            result: "リザルト"
        };

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (c) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "\"": "&quot;",
                    "'": "&#39;"
                }[c];
            });
        }

        function randomPatternFromText(optionText) {
            const text = String(optionText || "").trim();
            const upper = text.toUpperCase();
            if (!text || text === "?") {
                return "";
            }

            const explicit = text.match(/[1-7]{7}/);
            if (explicit) {
                return explicit[0];
            }
            if (upper.includes("MIRROR")) {
                return "7654321";
            }
            if (
                upper.includes("NORMAL") ||
                upper.includes("REGULAR") ||
                upper.includes("OFF") ||
                text.includes("正規")
            ) {
                return "1234567";
            }
            return "";
        }

        function randomPatternHtml(pattern, small) {
            if (!/^[1-7]{7}$/.test(pattern || "")) {
                return "";
            }
            const sizeClass = small ? " random-pattern-small" : "";
            return '<span class="random-pattern' + sizeClass + '" aria-label="' + pattern + '">' +
                pattern.split("").map(function (digit) {
                    return '<span class="random-digit" style="--digit-index:' + (Number(digit) - 1) + '"></span>';
                }).join("") +
                '</span>';
        }

        function optionHtml(optionText, small) {
            const text = String(optionText || "").trim();
            const parts = text.split("/").map(function (part) {
                const trimmed = part.trim();
                const pattern = randomPatternFromText(trimmed);
                const patternMarkup = randomPatternHtml(pattern, small);
                const label = trimmed.replace(/[1-7]{7}/, "").trim();
                const labelMarkup = label ? '<span class="option-text">' + escapeHtml(label) + '</span>' : "";
                return patternMarkup
                    ? '<span class="option-line">' + labelMarkup + patternMarkup + '</span>'
                    : '<span class="option-line"><span class="option-text">' + escapeHtml(trimmed || "?") + '</span></span>';
            });
            return parts.join('<span class="option-text"> / </span>');
        }

        function lampHtml(lampId, lampName) {
            const classes = {
                3: "ac",
                4: "ec",
                5: "nc",
                6: "hc",
                7: "exh",
                8: "fc",
                9: "perfect",
                10: "max"
            };
            if (lampId <= 0) {
                return '<span class="lamp-empty" aria-label="' + escapeHtml(lampName || "") + '"></span>';
            }
            const lampClass = lampId < 3 ? "failed" : classes[lampId];
            if (!lampClass) {
                return '<span class="lamp-empty" aria-label="' + escapeHtml(lampName || "") + '"></span>';
            }
            return '<span class="lamp ' + lampClass + '" aria-label="' + escapeHtml(lampName || "") + '"></span>';
        }

        function difficultyText(data) {
            if (Array.isArray(data.difficulties) && data.difficulties.length > 0) {
                return data.difficulties.map(function (difficulty) {
                    return String(difficulty || "").trim();
                }).filter(Boolean).join(", ");
            }
            return String(data.difficulty || "").trim();
        }

        function renderBestInfo(best) {
            const panel = document.getElementById("best-panel");
            if (!best) {
                panel.className = "info-panel";
                panel.innerHTML = "";
                return;
            }
            const lampId = Number(best.lampId) || 0;
            panel.className = "info-panel visible";
            panel.innerHTML = [
                '<div class="info-row">',
                '<div class="info-title">BEST</div>',
                '<div class="info-item"><span class="info-label">Lamp</span>' + lampHtml(lampId, best.lamp || "") + '</div>',
                '<div class="info-item"><span class="info-label">Score</span><span class="info-value">' + escapeHtml(best.score || 0) + '</span></div>',
                '<div class="info-item"><span class="info-label">Rate</span><span class="info-value">' + Number(best.rate || 0).toFixed(2) + '%</span></div>',
                '<div class="info-item"><span class="info-label">BP</span><span class="info-value">' + escapeHtml(best.bp || 0) + '</span></div>',
                '</div>',
                '<div class="info-row">',
                '<div></div>',
                '<div class="info-item best-option"><span class="info-label">Score opt</span>' + optionHtml(best.bestScoreOption || "?", true) + '</div>',
                '<div class="info-item best-option"><span class="info-label">BP opt</span>' + optionHtml(best.bestBpOption || "?", true) + '</div>',
                '</div>'
            ].join("");
        }

        function renderNexusInfo(nexus) {
            const panel = document.getElementById("nexus-panel");
            if (!nexus) {
                panel.className = "info-panel";
                panel.innerHTML = "";
                return;
            }
            panel.className = "info-panel visible";
            panel.innerHTML = [
                '<div class="info-row">',
                '<div class="info-title">NEXUS</div>',
                '<div class="info-item"><span class="info-label">Easy</span><span class="info-value nexus-value">' + Number(nexus.easy || 0).toFixed(2) + '</span></div>',
                '<div class="info-item"><span class="info-label">Clear</span><span class="info-value nexus-value">' + Number(nexus.normal || 0).toFixed(2) + '</span></div>',
                '<div class="info-item"><span class="info-label">Hard</span><span class="info-value nexus-value">' + Number(nexus.hard || 0).toFixed(2) + '</span></div>',
                '<div class="info-item"><span class="info-label">FC</span><span class="info-value nexus-value">' + Number(nexus.fc || 0).toFixed(2) + '</span></div>',
                '</div>'
            ].join("");
        }

        function update(data) {
            document.getElementById("title").textContent = data.title || "No song";
            document.getElementById("artist").textContent = data.artist || "";
            document.getElementById("difficulty").textContent = difficultyText(data) || "-";
            document.getElementById("scene").textContent = sceneNames[data.scene] || "waiting";
            document.getElementById("option").innerHTML = data.option
                ? '<span class="option-line"><span class="option-label">OPTION:</span>' + optionHtml(data.option, false) + '</span>'
                : "";
            renderBestInfo(data.best);
            renderNexusInfo(data.nexus);

            const body = document.getElementById("history-body");
            const history = Array.isArray(data.history) ? data.history : [];
            if (history.length === 0) {
                body.innerHTML = '<div class="empty">No play history for this chart</div>';
                return;
            }

            body.innerHTML = history.map(function (r) {
                const lampId = Number(r.lampId) || 0;
                return [
                    '<div class="row">',
                    '<div>' + escapeHtml(r.timestamp || "") + '</div>',
                    '<div>' + lampHtml(lampId, r.lamp || "") + '</div>',
                    '<div class="score">' + escapeHtml(r.score || 0) + '</div>',
                    '<div class="rate">' + Number(r.scoreRate || 0).toFixed(2) + '%</div>',
                    '<div class="bp">' + escapeHtml(r.bp || 0) + '</div>',
                    '<div class="history-option">' + optionHtml(r.option || "?", true) + '</div>',
                    '</div>'
                ].join("");
            }).join("");
        }

        function load() {
            const oldScript = document.getElementById("history-cursong-data");
            if (oldScript) {
                oldScript.remove();
            }

            const script = document.createElement("script");
            script.id = "history-cursong-data";
            script.src = "./history_cursong_data.js?ts=" + Date.now();
            script.onload = function () {
                if (window.__ORAJA_HELPER_CURRENT_SONG__) {
                    update(window.__ORAJA_HELPER_CURRENT_SONG__);
                }
            };
            script.onerror = function () {
                console.log("history_cursong_data.js load failed");
            };
            document.body.appendChild(script);
        }

        load();
        setInterval(load, 1000);
    </script>
</body>
</html>
